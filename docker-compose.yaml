version: "3"
services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - ./sample.sql:/docker-entrypoint-initdb.d/sample.sql


  app:
    build: .
    image: recipe-finder
    depends_on:
      - db
    command: sh -c "sleep 5 && node importIngredients.js && node importRecipes.js && node server.js"
    ports:
      - "13000:3000"
