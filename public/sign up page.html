<!DOCTYPE html>
<html>
<head>
<title>Sign Up</title>

<style>
body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg, #fc0000,#fa6666,#f81e0e);
}

.container{
background:white;
padding:40px;
border-radius:10px;
width:320px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{text-align:center;}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
background:#4facfe;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2f80ed;
}

.link{
text-align:center;
margin-top:10px;
}
</style>

</head>
<body>

<div class="container">

<h2>Sign Up</h2>

<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button>Create Account</button>

<div class="link">
Already have an account? <a href="signin.html">Sign In</a>
</div>

</div>

</body>
</html>
