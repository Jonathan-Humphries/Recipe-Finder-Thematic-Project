<!DOCTYPE html>
<html>
<head>
<title>Sign In</title>

<style>
body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg, #fc0000,#fa6666,#f81e0e);
}

.container{
background:white;
padding:40px;
border-radius:10px;
width:320px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{text-align:center;}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
background:#667eea;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#5a6fd8;
}

.link{
text-align:center;
margin-top:10px;
}
</style>

</head>
<body>

<div class="container">

<h2>Sign In</h2>

<input type="email" placeholder="Email">
<input type="password" placeholder="Password">

<button>Login</button>

<div class="link">
Don't have an account? <a href="signup.html">Sign Up</a>
</div>

</div>

</body>
</html>
