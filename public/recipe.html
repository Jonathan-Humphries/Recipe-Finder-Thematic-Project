<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe — Recipe Finders</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="recipe">

  <!-- NAVIGATION -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-leaf"></span>
        Recipe Finders
      </a>
      <div class="nav-actions">
        <div id="nav-auth-btns" style="display:flex;align-items:center;gap:0.75rem;">
          <a href="login.html"  class="btn-nav-login">Sign in</a>
          <a href="signup.html" class="btn-nav-signup">Get started</a>
        </div>
        <div id="nav-user-menu" class="nav-user-menu" style="display:none;">
          <a href="account.html">
            <div class="user-avatar" id="user-avatar">?</div>
          </a>
          <span class="user-name" id="user-name-display"></span>
          <button class="btn-logout" id="btn-logout">Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <div class="recipe-hero">
    <img class="recipe-hero-img" id="hero-img" src="" alt="">
    <div class="recipe-hero-overlay"></div>
    <div class="recipe-hero-content">
      <div class="recipe-breadcrumb">
        <a href="index.html">← All recipes</a>
        <span class="sep">/</span>
        <span id="hero-title-breadcrumb">Recipe</span>
      </div>
      <h1 class="recipe-hero-title" id="hero-title">Loading…</h1>
      <div class="recipe-hero-meta">
        <div class="recipe-meta-pill">
          <span id="meta-time">—</span>
        </div>
        <div class="recipe-meta-pill">
          <span id="meta-servings">—</span>
        </div>
        <div class="recipe-meta-pill" id="difficulty-pill">
          <span id="meta-difficulty">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="recipe-main">

    <!-- LEFT: Steps & Info -->
    <div class="recipe-content-col">

      <p class="recipe-description" id="recipe-description"></p>
      <div class="recipe-tags" id="recipe-tags"></div>

      <section class="steps-section">
        <div class="section-header">
          <h2 class="section-title">How to make it</h2>
        </div>
        <p style="font-size:0.82rem;color:#8a8a7a;margin-bottom:1rem;">Click each step to mark it as done</p>
        <div class="steps-list" id="steps-list"></div>
      </section>

      <div class="notes-section" id="notes-section">
        <div>
          <div class="notes-title">Chef's Note</div>
          <p class="notes-text" id="recipe-notes"></p>
        </div>
      </div>

    </div>

    <!-- RIGHT: Sidebar -->
    <aside class="recipe-sidebar">

      <!-- Ingredients -->
      <div class="ingredients-card">
        <div class="ingredients-card-header">
          <h3 class="ingredients-card-title">Ingredients</h3>
          <div class="servings-control">
            <span class="servings-label">Serves</span>
            <button class="servings-btn" id="btn-servings-minus">−</button>
            <span class="servings-count" id="servings-count">—</span>
            <button class="servings-btn" id="btn-servings-plus">+</button>
          </div>
        </div>
        <div class="ingredients-list" id="ingredients-list">
          <p style="padding:1rem;color:#8a8a7a;font-size:0.9rem;">Loading…</p>
        </div>
      </div>
       <!-- Nutrition -->
      <div class="nutrition-section">
  <h2>Nutrition per serving</h2>
  <div class="nutrition-grid">
    <div class="nutrition-card">
      <div class="nutrition-value" data-base="480">480</div>
      <div class="nutrition-label">Calories</div>
    </div>
    <div class="nutrition-card">
      <div class="nutrition-value" data-base="14">14</div>
      <div class="nutrition-label">Protein</div>
    </div>
    <div class="nutrition-card">
      <div class="nutrition-value" data-base="68">68</div>
      <div class="nutrition-label">Carbs</div>
    </div>
    <div class="nutrition-card">
      <div class="nutrition-value" data-base="16">16</div>
      <div class="nutrition-label">Fat</div>
    </div>
    <div class="nutrition-card">
      <div class="nutrition-value" data-base="3">3</div>
      <div class="nutrition-label">Fibre</div>
    </div>
  </div>
</div>

      <!-- Actions -->
      <div class="action-card">
        <h3 class="action-card-title">Save &amp; share</h3>
        <button class="btn-save-recipe" id="btn-save-recipe">Save this recipe</button>
        <button class="btn-share-recipe" id="btn-share-recipe">Share recipe</button>
      </div>

    </aside>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Recipe <span>Finders</span></div>
      <div class="footer-copy">2026 Recipe Finders.</div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="js/Javascript.js"></script>
</body>
</html>
