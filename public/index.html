<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recipe Finder</title>

        <style>
            /* Temp CSS to check layout works */

            body {
                width: 100vw;
                height: 100vh;

                overflow: hidden;

                margin: 0;
                padding: 0;
            }

            header {
                width: 100%;
                height: 5%;

                overflow: hidden;

                margin: 0;
                padding: 0;

                background-color: red;
            }

            header h1 {
                margin: 0;
                padding: 0;
            }

            #page {
                width: 100%;
                height: 95%;

                overflow: hidden;

                margin: 0;
                padding: 0;

                display: flex;
                flex-direction: row;
            }

            #sidebar {
                /* width: 5vh; */
                width: 25vw;
                height: 100%;

                overflow: hidden;

                background-color: lightpink;
            }

            #toggle-sidebar {
                width: 5vh;
                height: 2vh;

                position:absolute;

                left: 25vw;
                top: 7vh;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Recipe Finder</h1>
        </header>
        <div id="page">
            <form id="sidebar">
                <h2 class="label">Recipe name</h2>
                <input type="search" name="nameSearch" id="name-search">

                <hr>

                <h2 class="label">Tags</h2>
                <div id="tag-select">
                    <div class="tag" id="tag-example">
                        <label for="c-tagid">Tag Name</label>
                        <input type="checkbox" name="checkboxTag" id="c-tagid">
                    </div>
                </div>

                <hr>

                <h2 class="label">Ingredients</h2>
                <div id="ingredient-select">
                    <div>
                        <img src="" alt="A photo of {ignredient name}.">
                        <div>
                            <h3>Ingredient Name</h3>
                            <div>
                                <input type="text" name="" id="">
                                <input type="checkbox" name="" id="">
                            </div>
                        </div>
                    </div>
                </div>

                <hr>

                <button type="submit" name="recipeSearch" id="recipe-search">Search</button>
                <button type="button" name="toggleSidebar" id="toggle-sidebar"></button>
            </form>
            <div id="content">
                <h1>Recipes</h1>

                <hr>

                <div id="recipe-deposit">
                    <div id="recipe-card-example" class="recipe-card">
                        <img src="" alt="A photo of {insert name here}.">
                        <div>
                            <div>
                                <h3>Recipe Name</h3>
                                <p>serves x</p>
                            </div>

                            <br>

                            <div class="tags">
                                <a href="" class="tag-link">Vegan</a>
                            </div>

                            <p class="recipe-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis varius justo semper sem pulvinar, id facilisis risus gravida. Mauris scelerisque elit a tellus pharetra lacinia.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
